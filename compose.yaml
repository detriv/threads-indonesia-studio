services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-threads_id}
      POSTGRES_USER: ${POSTGRES_USER:-threads}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threads_local_only}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: api
    restart: on-failure:5
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://threads:threads_local_only@db:5432/threads_id}
      API_PORT: 3000
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-simulation}
      GENERATION_DAILY_LIMIT: ${GENERATION_DAILY_LIMIT:-20}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_MODEL_IDEAS: ${GEMINI_MODEL_IDEAS:-}
      GEMINI_MODEL_SHORT: ${GEMINI_MODEL_SHORT:-}
      GEMINI_MODEL_DEEP: ${GEMINI_MODEL_DEEP:-}
      GEMINI_MODEL_REVISE: ${GEMINI_MODEL_REVISE:-}
      GEMINI_MODEL_TRY_THEME: ${GEMINI_MODEL_TRY_THEME:-}
      THREADS_APP_ID: ${THREADS_APP_ID:-}
      THREADS_APP_SECRET: ${THREADS_APP_SECRET:-}
      THREADS_USER_ID: ${THREADS_USER_ID:-}
      THREADS_SCOPES: ${THREADS_SCOPES:-threads_basic,threads_content_publish}
      THREADS_OAUTH_REDIRECT: ${THREADS_OAUTH_REDIRECT:-http://127.0.0.1:8080/api/threads/oauth-callback}
      THREADS_TOKEN_FILE: /tmp/threads-token/token
      DEMO_MODE: "true"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      TZ: UTC
    volumes:
      - threads_token:/tmp/threads-token
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      target: worker
    restart: on-failure:5
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://threads:threads_local_only@db:5432/threads_id}
      DEMO_MODE: "true"
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-simulation}
      GENERATION_DAILY_LIMIT: ${GENERATION_DAILY_LIMIT:-20}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_MODEL_IDEAS: ${GEMINI_MODEL_IDEAS:-}
      GEMINI_MODEL_SHORT: ${GEMINI_MODEL_SHORT:-}
      GEMINI_MODEL_DEEP: ${GEMINI_MODEL_DEEP:-}
      GEMINI_MODEL_REVISE: ${GEMINI_MODEL_REVISE:-}
      GEMINI_MODEL_TRY_THEME: ${GEMINI_MODEL_TRY_THEME:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_ALLOW_OUTBOUND: ${GEMINI_ALLOW_OUTBOUND:-false}
      GEMINI_PRICING_JSON: ${GEMINI_PRICING_JSON:-}
      THREADS_APP_ID: ${THREADS_APP_ID:-}
      THREADS_APP_SECRET: ${THREADS_APP_SECRET:-}
      THREADS_USER_ID: ${THREADS_USER_ID:-}
      THREADS_ACCESS_TOKEN: ${THREADS_ACCESS_TOKEN:-}
      THREADS_SCOPES: ${THREADS_SCOPES:-threads_basic,threads_content_publish}
      THREADS_LIVE_POSTING: ${THREADS_LIVE_POSTING:-false}
      THREADS_TOKEN_FILE: /tmp/threads-token/token
      TZ: UTC
    volumes:
      - threads_token:/tmp/threads-token
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/worker-ready"]
      interval: 3s
      timeout: 2s
      retries: 20

  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  threads_token:
