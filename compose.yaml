services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-threads_id}
      POSTGRES_USER: ${POSTGRES_USER:-threads}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threads_local_only}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: api
    restart: on-failure:5
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://threads:threads_local_only@db:5432/threads_id}
      API_PORT: 3000
      DEMO_MODE: "true"
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      target: worker
    restart: on-failure:5
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://threads:threads_local_only@db:5432/threads_id}
      DEMO_MODE: "true"
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/worker-ready"]
      interval: 3s
      timeout: 2s
      retries: 20

  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
